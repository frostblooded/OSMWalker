name: Set up Node and dependencies
description: Node 24 and node_modules, restored whole from the cache when package-lock.json is unchanged.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - id: modules
      uses: actions/cache@v4
      with:
        path: node_modules
        key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
