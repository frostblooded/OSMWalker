name: Set up Godot
description: Installs a cached Godot editor binary (and optionally web export templates).
inputs:
  version:
    required: true
  web-templates:
    default: "false"
runs:
  using: composite
  steps:
    - name: Cache Godot
      id: godot
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-bin-${{ inputs.version }}
    - name: Download Godot
      if: steps.godot.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p ~/godot
        curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${{ inputs.version }}-stable/Godot_v${{ inputs.version }}-stable_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d /tmp/godot
        mv /tmp/godot/Godot_v*_linux.x86_64 ~/godot/godot
    - shell: bash
      run: sudo ln -sf ~/godot/godot /usr/local/bin/godot
    - name: Cache web export templates
      if: inputs.web-templates == 'true'
      id: templates
      uses: actions/cache@v4
      with:
        path: ~/.local/share/godot/export_templates
        key: godot-web-templates-${{ inputs.version }}
    - name: Download web export templates
      if: inputs.web-templates == 'true' && steps.templates.outputs.cache-hit != 'true'
      shell: bash
      run: |
        curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${{ inputs.version }}-stable/Godot_v${{ inputs.version }}-stable_export_templates.tpz"
        dir=~/.local/share/godot/export_templates/${{ inputs.version }}.stable
        mkdir -p "$dir"
        unzip -q -j /tmp/templates.tpz 'templates/web_*' 'templates/version.txt' -d "$dir"
    - name: Cache imported assets
      uses: actions/cache@v4
      with:
        path: .godot
        key: godot-import-${{ inputs.version }}-${{ hashFiles('**/*.gd', '**/*.tscn', '**/*.tres', '**/*.svg', 'project.godot') }}
        restore-keys: godot-import-${{ inputs.version }}-
    - name: Import project
      shell: bash
      run: godot --headless --import
