name: Overpass probe
on: push
permissions:
  contents: write
jobs:
  probe:
    if: github.ref == 'refs/heads/claude/project-thread-vwz8im'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OpenFreeMap fixtures for Sofia
        run: |
          set -x
          mkdir -p tests/fixtures/ofm
          curl -sSD - -o tests/fixtures/ofm/tilejson.json https://tiles.openfreemap.org/planet
          T=$(python3 -c "import json;print(json.load(open('tests/fixtures/ofm/tilejson.json'))['tiles'][0])")
          for xy in 9253/6039 9254/6039; do
            u=$(echo "$T" | sed "s#{z}/{x}/{y}#14/$xy#")
            f=tests/fixtures/ofm/14_$(echo $xy | tr / _).pbf
            curl -sS -D - -o "$f" "$u"
            curl -sS -D - -o /dev/null -H "Accept-Encoding: gzip" "$u"
            file "$f"; ls -l "$f"
          done
          if git status --porcelain | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898+github-actions[bot]@users.noreply.github.com"
            git add tests/fixtures/ofm && git commit -m "Add OpenFreeMap Sofia fixtures" && git push
          fi
