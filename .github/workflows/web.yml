name: Web (TypeScript)

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

# check and build run in parallel; e2e and perf play the same build in parallel.
# master pushes deploy that build to GitHub Pages once everything passes,
# then live-check plays the deployed site to prove it loads.
jobs:
  check:
    name: Typecheck + unit/integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 7

  e2e:
    name: Browser e2e
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Play the game (runner's Chrome, no browser download)
        env:
          CI: "true"
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  perf:
    name: Perf budgets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - name: Check budgets on a mid-range phone profile
        env:
          CI: "true"
        run: npm run perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf-results
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    needs: [check, e2e, perf]
    # Pushes to master, or a manual run on master to redeploy.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

  live-check:
    name: Play the live site
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Play the deployed game with the real map services
        env:
          CI: "true"
          LIVE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          # Pages can take a moment to serve the new build.
          for i in $(seq 1 12); do curl -sfo /dev/null "$LIVE_URL" && break; sleep 5; done
          npx playwright test boot live
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
