name: Web (TypeScript)

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

# check and build run in parallel; e2e and perf play the same build in parallel.
jobs:
  check:
    name: Typecheck + unit/integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  e2e:
    name: Browser e2e
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Play the game (runner's Chrome, no browser download)
        env:
          CI: "true"
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  perf:
    name: Perf budgets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Check budgets on a mid-range phone profile
        env:
          CI: "true"
        run: npm run perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: web/perf-results
          if-no-files-found: ignore
